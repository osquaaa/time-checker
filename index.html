<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Modern</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --primary: #6366f1;
        --text: #1e293b;
        --accent: #f59e0b; /* Золотой для праздника */
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        transition: background 0.5s;
      }

      /* Навигация */
      .nav {
        display: flex;
        gap: 10px;
        padding: 30px 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .nav-item {
        padding: 10px 18px;
        background: var(--card);
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        transition: 0.2s;
        color: #64748b;
      }

      .nav-item.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
        box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
      }

      .btn-add {
        background: #f1f5f9;
        border: 1px dashed #cbd5e1;
      }

      /* Карточка */
      .container {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 20px;
      }

      .card {
        background: var(--card);
        padding: 50px 40px;
        border-radius: 30px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 650px;
        text-align: center;
        position: relative;
      }

      .card.celebration {
        border: 2px solid var(--accent);
        box-shadow: 0 0 30px rgba(245, 158, 11, 0.15);
      }

      .name {
        font-size: 2.5rem;
        font-weight: 800;
        margin-bottom: 30px;
        color: var(--text);
      }

      /* Сетка таймера */
      .timer-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 15px;
      }

      .t-box {
        background: #f8fafc;
        padding: 20px 10px;
        border-radius: 20px;
        border: 1px solid #f1f5f9;
      }

      .t-num {
        display: block;
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--primary);
      }

      .t-label {
        font-size: 0.8rem;
        color: #94a3b8;
        text-transform: uppercase;
        font-weight: 600;
      }

      /* Кнопки */
      .actions {
        margin-top: 40px;
      }
      .btn {
        padding: 14px 28px;
        border-radius: 14px;
        border: none;
        font-weight: 700;
        cursor: pointer;
        transition: 0.2s;
      }
      .btn-play {
        background: #1e293b;
        color: white;
      }
      .btn-play:hover {
        transform: scale(1.05);
      }

      /* Игра */
      #game-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        z-index: 1000;
        display: none;
        flex-direction: column;
      }
      .game-header {
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #eee;
      }
      .game-area {
        flex: 1;
        position: relative;
        overflow: hidden;
        background: #fafafa;
      }
      .exit-x {
        font-size: 2rem;
        cursor: pointer;
        color: #ef4444;
        border: none;
        background: none;
        padding: 10px;
      }

      .target-svg {
        position: absolute;
        width: 60px;
        height: 60px;
        cursor: pointer;
        transition: transform 0.1s;
      }

      /* Модалка */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }
      .modal-content {
        background: white;
        padding: 30px;
        border-radius: 20px;
        width: 350px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: 1px solid #ddd;
        border-radius: 8px;
      }

      @media (max-width: 500px) {
        .timer-grid {
          grid-template-columns: 1fr 1fr;
        }
        .name {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="nav" id="nav"></div>

    <div class="container">
      <div class="card" id="main-card">
        <h1 class="name" id="display-name">...</h1>

        <div class="timer-grid">
          <div class="t-box">
            <span class="t-num" id="d">00</span
            ><span class="t-label">Дней</span>
          </div>
          <div class="t-box">
            <span class="t-num" id="h">00</span
            ><span class="t-label">Часов</span>
          </div>
          <div class="t-box">
            <span class="t-num" id="m">00</span><span class="t-label">Мин</span>
          </div>
          <div class="t-box">
            <span class="t-num" id="s">00</span><span class="t-label">Сек</span>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-play" onclick="openGame()">
            Запустить игру
          </button>
        </div>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="modal-content">
        <h3>Добавить человека</h3>
        <input type="text" id="in-name" placeholder="Имя" />
        <input type="date" id="in-date" />
        <button class="btn btn-play" style="width: 100%" onclick="savePerson()">
          Добавить
        </button>
        <button
          class="btn"
          style="width: 100%; margin-top: 10px"
          onclick="closeModal()"
        >
          Отмена
        </button>
      </div>
    </div>

    <div id="game-overlay">
      <div class="game-header">
        <div style="font-size: 1.5rem; font-weight: 800">
          Очки: <span id="score">0</span>
        </div>
        <button class="exit-x" onclick="closeGame()">✕</button>
      </div>
      <div class="game-area" id="game-area"></div>
    </div>

    <script>
      const DEFAULT_PEOPLE = [
        { name: "Стефания", m: 1, d: 7 },
        { name: "Арина", m: 6, d: 8 },
        { name: "Трофим", m: 1, d: 6 },
        { name: "Алла", m: 5, d: 10 },
        { name: "Денис", m: 5, d: 5 },
        { name: "Марк", m: 2, d: 5 },
      ];

      let people = [];
      let currentIdx = 0;

      function init() {
        // Загрузка
        const custom = JSON.parse(localStorage.getItem("bdays_v3") || "[]");
        people = [...DEFAULT_PEOPLE, ...custom];

        currentIdx = parseInt(localStorage.getItem("last_idx_v3") || 0);
        if (currentIdx >= people.length) currentIdx = 0;

        renderNav();
        select(currentIdx);
        setInterval(tick, 1000);
      }

      function renderNav() {
        const nav = document.getElementById("nav");
        nav.innerHTML = "";
        people.forEach((p, i) => {
          const el = document.createElement("div");
          el.className = `nav-item ${i === currentIdx ? "active" : ""}`;
          el.innerText = p.name;
          el.onclick = () => select(i);
          nav.appendChild(el);
        });

        const add = document.createElement("div");
        add.className = "nav-item btn-add";
        add.innerText = "+ Добавить";
        add.onclick = () =>
          (document.getElementById("modal").style.display = "flex");
        nav.appendChild(add);
      }

      function select(i) {
        currentIdx = i;
        localStorage.setItem("last_idx_v3", i);
        renderNav();
        tick();
      }

      function tick() {
        const p = people[currentIdx];
        const now = new Date();
        // Создаем дату рождения в текущем году
        let bday = new Date(now.getFullYear(), p.m - 1, p.d);

        // Если днюха прошла (разница больше 24 часов в минус), берем следующий год
        if (now - bday > 86400000) {
          bday.setFullYear(now.getFullYear() + 1);
        }

        const diff = bday - now;
        const days = Math.floor(diff / 86400000);

        document.getElementById("display-name").innerText = p.name;

        // Визуальные эффекты при близости
        const card = document.getElementById("main-card");
        if (days >= 0 && days < 7) {
          card.classList.add("celebration");
        } else {
          card.classList.remove("celebration");
        }

        // Если днюха сегодня
        if (diff <= 0 && diff > -86400000) {
          document.getElementById("d").innerText = "0";
          document.getElementById("display-name").innerText =
            "С Днём Рождения, " + p.name + "!";
        } else {
          document.getElementById("d").innerText = days;
          document.getElementById("h").innerText = Math.floor(
            (diff / 3600000) % 24,
          );
          document.getElementById("m").innerText = Math.floor(
            (diff / 60000) % 60,
          );
          document.getElementById("s").innerText = Math.floor(
            (diff / 1000) % 60,
          );
        }
      }

      // Добавление
      function closeModal() {
        document.getElementById("modal").style.display = "none";
      }
      function savePerson() {
        const name = document.getElementById("in-name").value;
        const date = document.getElementById("in-date").value;
        if (!name || !date) return;

        const d = new Date(date);
        const newP = { name, m: d.getMonth() + 1, d: d.getDate() };

        const custom = JSON.parse(localStorage.getItem("bdays_v3") || "[]");
        custom.push(newP);
        localStorage.setItem("bdays_v3", JSON.stringify(custom));

        people.push(newP);
        closeModal();
        renderNav();
        select(people.length - 1);
      }

      // --- ИГРА (УЛУЧШЕННАЯ) ---
      let score = 0;
      let gameTimer;
      const giftSVG = `<svg viewBox="0 0 24 24" fill="#6366f1"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.5 2.5 0 0 0-5-0c0 .35.07.69.18 1H11c.11-.31.18-.65.18-1a2.5 2.5 0 0 0-5 0c0 .35.07.69.18 1H4a2 2 0 0 0-2 2v2c0 .55.45 1 1 1h18c.55 0 1-.45 1-1V8a2 2 0 0 0-2-2zM7 4a.5.5 0 0 1 .5.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-.28.22-.5.5-.5zm10 0a.5.5 0 0 1 .5.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-.28.22-.5.5-.5zM3 12v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7H3zm8 7H5v-5h6v5zm8 0h-6v-5h6v5z"/></svg>`;

      function openGame() {
        document.getElementById("game-overlay").style.display = "flex";
        score = 0;
        document.getElementById("score").innerText = "0";
        spawn();
      }

      function closeGame() {
        document.getElementById("game-overlay").style.display = "none";
        clearTimeout(gameTimer);
        document.getElementById("game-area").innerHTML = "";
      }

      function spawn() {
        const area = document.getElementById("game-area");
        const div = document.createElement("div");
        div.className = "target-svg";
        div.innerHTML = giftSVG;

        const x = Math.random() * (area.clientWidth - 70);
        const y = Math.random() * (area.clientHeight - 70);
        div.style.left = x + "px";
        div.style.top = y + "px";

        div.onclick = () => {
          score++;
          document.getElementById("score").innerText = score;
          div.remove();
          clearTimeout(gameTimer);
          spawn(); // Следующий появляется только после клика или таймаута
        };

        area.appendChild(div);

        // Если не кликнули за 1.5 сек, подарок исчезает и появляется новый
        gameTimer = setTimeout(() => {
          div.remove();
          spawn();
        }, 1500);
      }

      init();
    </script>
  </body>
</html>
